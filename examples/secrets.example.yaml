# -----------------------------------------------------------------------------
# Secret for Woow_k3s_homeassistant - PLACEHOLDERS ONLY. Never commit real values.
#
# Used with the default secrets.create=false: the chart only references this
# Secret by name (secrets.existingSecretName, default "postgres-secret").
# Copy this file OUTSIDE the repo, replace REPLACE_ME_PG_PASSWORD, then apply
# that copy:
#   kubectl --context <ctx> apply -f /secure/path/postgres-secret.yaml
#
# The wait-for-postgres initContainer and the postgres StatefulSet's probes
# hardcode user "homeassistant" and database "homeassistant" - do not change
# POSTGRES_USER / POSTGRES_DB unless you also change every hardcoded probe in
# templates/homeassistant-deployment.yaml and templates/postgres-statefulset.yaml.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: homeassistant
  labels:
    app: homeassistant
    component: postgres
type: Opaque
stringData:
  POSTGRES_USER: "homeassistant"
  POSTGRES_PASSWORD: "REPLACE_ME_PG_PASSWORD"
  POSTGRES_DB: "homeassistant"
  # Home Assistant's recorder does NOT read this from the environment - it
  # only reads recorder_db_url from config/secrets.yaml. Keeping the value
  # here as a reminder to keep both in sync:
  # postgresql://homeassistant:REPLACE_ME_PG_PASSWORD@postgres.homeassistant.svc.cluster.local:5432/homeassistant?client_encoding=utf8
