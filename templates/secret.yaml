{{- /*
Rendered only with secrets.create=true (fresh installs, tests). By default
(secrets.create=false) the Secret named secrets.existingSecretName already
exists out of band (see examples/secrets.example.yaml) and the chart never
touches it, so a `helm upgrade` can never overwrite a real password.
*/ -}}
{{- if .Values.secrets.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.existingSecretName }}
  namespace: {{ include "homeassistant.ns" . }}
  labels:
    app: homeassistant
    component: postgres
  {{- include "homeassistant.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "secrets.postgresUser is required when secrets.create=true" .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required when secrets.create=true" .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ required "secrets.postgresDb is required when secrets.create=true" .Values.secrets.postgresDb | quote }}
{{- end }}
