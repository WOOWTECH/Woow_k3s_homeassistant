---
# PVC for Home Assistant /config directory
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ha-config
  namespace: {{ .Values.namespace.name }}
  labels:
    app: homeassistant
    component: homeassistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.homeassistant.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.homeassistant.persistence.size }}
{{- if .Values.postgres.enabled }}
---
# PVC for PostgreSQL data directory
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: {{ .Values.namespace.name }}
  labels:
    app: homeassistant
    component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.postgres.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
{{- end }}
