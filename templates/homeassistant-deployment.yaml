---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: {{ .Values.namespace.name }}
  labels:
    app: homeassistant
    component: homeassistant
spec:
  replicas: 1
  strategy:
    type: Recreate          # single-writer for the /config volume
  selector:
    matchLabels:
      app: homeassistant
      component: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
        component: homeassistant
    spec:
      # hostNetwork: true allows Home Assistant to discover devices on the
      # local network (mDNS, SSDP, etc.). If device discovery is not needed,
      # set this to false and rely on the NodePort Service instead.
      hostNetwork: {{ .Values.homeassistant.hostNetwork }}
      dnsPolicy: ClusterFirst
      {{- if .Values.postgres.enabled }}
      initContainers:
        # Wait for PostgreSQL to be ready before starting Home Assistant
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres.{{ .Values.namespace.name }}.svc.cluster.local -p 5432 -U homeassistant; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecretName }}
                  key: POSTGRES_PASSWORD
      {{- end }}
      containers:
        - name: homeassistant
          image: "{{ .Values.homeassistant.image.repository }}:{{ .Values.homeassistant.image.tag }}"
          imagePullPolicy: {{ .Values.homeassistant.image.pullPolicy }}
          ports:
            - containerPort: 8123
              name: http
              protocol: TCP
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: homeassistant-config
                  key: TZ
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecretName }}
          volumeMounts:
            - name: ha-config
              mountPath: /config
          resources:
            {{- toYaml .Values.homeassistant.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
      volumes:
        - name: ha-config
          persistentVolumeClaim:
            claimName: ha-config
      terminationGracePeriodSeconds: 30
