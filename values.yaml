# Default values for the homeassistant chart.
# Defaults reproduce the original Kustomize deployment 1:1
# (namespace homeassistant, NodePort 31812, local-path storage,
# PostgreSQL 16 recorder backend).

namespace:
  # Render the Namespace object. A namespace equal to the release namespace
  # (`-n`) is never rendered - create it with --create-namespace instead - so
  # `helm uninstall` can never delete the namespace the release lives in.
  create: true
  # EMPTY BY DEFAULT so `-n` controls placement. A non-empty value here
  # silently overrides `-n`, which is how a rehearsal once wrote Helm
  # ownership annotations onto a live production Deployment.
  name: ""

# Add `helm.sh/resource-policy: keep` to the Namespace (when rendered), the
# two PVCs and the chart-created Secret, so `helm uninstall` never deletes
# Home Assistant's /config state or the Postgres recorder database.
keepOnUninstall: true

homeassistant:
  image:
    repository: ghcr.io/home-assistant/home-assistant
    tag: stable
    # "Always" matches the original manifests' behaviour with a mutable
    # tag (Kubernetes defaults to Always for :latest; :stable moves too,
    # so we set Always explicitly for parity).
    pullPolicy: Always

  # Exposed to the homeassistant container via a ConfigMap (env valueFrom).
  # Also consumed by the postgres StatefulSet for timezone alignment.
  config:
    TZ: "Asia/Taipei"

  # hostNetwork lets HA discover LAN devices (mDNS, SSDP). Keep false to
  # rely on the NodePort Service; set true when device discovery is needed.
  hostNetwork: false

  service:
    type: NodePort
    port: 8123
    # Only used when type is NodePort.
    nodePort: 31812

  persistence:
    # PVC for /config (HA state, dashboards, .storage/).
    storageClassName: local-path
    size: 5Gi

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

postgres:
  # Deploy the PostgreSQL StatefulSet used as HA's recorder backend.
  enabled: true

  image:
    repository: postgres
    tag: 16-alpine
    # Kubernetes default for pinned tags is IfNotPresent; keep the same.
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432

  persistence:
    # PVC for /var/lib/postgresql/data.
    storageClassName: local-path
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

secrets:
  # false (default): the Secret named existingSecretName already exists
  #   (created from examples/secrets.example.yaml) and the chart never
  #   renders it, so a `helm upgrade` can never overwrite a real password.
  # true: render the Secret from the values below (fresh installs, tests).
  create: false
  # Name of the Postgres credentials Secret, existing or chart-created.
  # The probes and both containers reference this exact name; the wait-for-postgres
  # initContainer and the recorder both need POSTGRES_USER/PASSWORD/DB from it.
  existingSecretName: "postgres-secret"
  # -- PostgreSQL superuser / recorder DB owner (only used when create=true)
  postgresUser: ""
  # -- PostgreSQL password (only used when create=true; must also match
  #    recorder_db_url in your HA config/secrets.yaml)
  postgresPassword: ""
  # -- PostgreSQL database name (only used when create=true)
  postgresDb: ""

tests:
  # `helm test` smoke pod: HA web UI on 8123, Postgres pg_isready. Read-only.
  enabled: true
